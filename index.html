<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CryptoEmpire Mobile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --neon: #00f2ff; --accent: #bc13fe; --bg: #030303;
            --glass: rgba(255, 255, 255, 0.07); --border: rgba(255, 255, 255, 0.1);
            --success: #00ff88; --gold: #ffcc00; --danger: #ff3131; --warning: #ffaa00;
        }

        * { box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
        
        body {
            background: var(--bg); color: #fff; margin: 0;
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }

        /* Загрузка */
        #loading-screen {
            position: fixed; top:0; left:0; width:100%; height:100%; 
            background: #000; z-index: 9999; display: flex; 
            flex-direction: column; align-items: center; justify-content: center;
        }
        .loader-bar { width: 200px; height: 2px; background: #222; margin-top: 20px; }
        .loader-fill { width: 0%; height: 100%; background: var(--neon); box-shadow: 0 0 15px var(--neon); transition: 0.2s; }

        /* Мобильный контейнер */
        .app-container { display: flex; flex-direction: column; height: 100vh; }

        /* Верхняя панель (Статистика) */
        .dashboard { 
            background: #0a0a0a; border-bottom: 1px solid var(--border); 
            padding: 12px; z-index: 10; flex-shrink: 0;
        }

        /* Центральная зона (Ферма) */
        .main { 
            flex: 1; overflow-y: auto; padding: 12px;
            background: radial-gradient(circle at top, #0f0f0f, #000);
        }

        /* Нижняя панель (Магазин) */
        .sidebar { 
            background: #0a0a0a; border-top: 1px solid var(--border);
            padding: 12px; height: 35vh; overflow-y: auto; flex-shrink: 0;
        }

        /* Сетки */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        .stat-card { background: #121212; padding: 8px 12px; border-radius: 10px; border-left: 3px solid var(--accent); }
        .stat-card small { color: #555; text-transform: uppercase; font-size: 8px; display: block; }
        .stat-val { font-size: 14px; font-weight: bold; }

        .farm-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .rack { background: rgba(255,255,255,0.03); border: 1px solid #222; border-radius: 12px; padding: 8px; }
        
        .slot { 
            height: 40px; background: rgba(0,0,0,0.4); margin-bottom: 4px; 
            border-radius: 6px; display: flex; flex-direction: column; 
            justify-content: center; padding: 0 8px; font-size: 10px; 
            position: relative; overflow: hidden; border: 1px solid transparent;
        }
        .slot.active { border-color: #222; }
        .slot.broken { border-color: var(--danger); color: var(--danger); background: rgba(255, 49, 49, 0.05); }
        .hp-bar { position: absolute; bottom: 0; left: 0; height: 2px; transition: 0.3s; }

        /* Кнопки */
        .btn { width: 100%; padding: 12px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 11px; }
        .btn-mine { background: linear-gradient(45deg, var(--neon), var(--accent)); color: #000; height: 50px; font-size: 14px; margin-top: 5px; }
        .btn:active { transform: scale(0.98); }

        .shop-item {
            background: var(--glass); border: 1px solid var(--border); border-radius: 10px;
            padding: 10px; display: flex; align-items: center; gap: 10px; margin-bottom: 8px;
        }
        .shop-item.locked { opacity: 0.2; filter: grayscale(1); pointer-events: none; }

        .floating-text { position: absolute; color: var(--neon); font-weight: bold; pointer-events: none; animation: float 0.6s forwards; z-index: 1000; }
        @keyframes float { to { transform: translateY(-60px); opacity: 0; } }
    </style>
</head>
<body>

    <div id="loading-screen">
        <i class="fas fa-microchip fa-3x" style="color: var(--neon)"></i>
        <h3 style="letter-spacing: 4px; margin-top: 15px; font-size: 14px;">CRYPTO EMPIRE</h3>
        <div class="loader-bar"><div class="loader-fill" id="load-fill"></div></div>
    </div>

    <div class="app-container">
        <header class="dashboard">
            <div class="stats-grid">
                <div class="stat-card"><small>Баланс</small><div id="cash" class="stat-val" style="color:var(--success)">$ 0</div></div>
                <div class="stat-card"><small>Хешрейт</small><div id="hash" class="stat-val">0 MH/s</div></div>
                <div class="stat-card"><small>Биткоин</small><div id="btc" class="stat-val" style="color:var(--neon)">₿ 0.00</div></div>
                <div class="stat-card"><small>Курс BTC</small><div class="stat-val">$<span id="btc-p">0</span></div></div>
            </div>
            <div style="display: flex; gap: 6px;">
                <button class="btn" style="background:var(--success); flex: 1" onclick="game.sellBtc()">Продать</button>
                <button class="btn" id="boost-btn" style="background:var(--gold); color:#000; flex: 1" onclick="game.activateBoost()">BOOST</button>
            </div>
            <button class="btn btn-mine" onclick="game.manualMine(event)">ГЕНЕРИРОВАТЬ ХЕШ</button>
        </header>

        <main class="main">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <h2 style="margin:0; font-size:14px;">NODES [<span id="node-count">0</span>]</h2>
                <button class="btn" style="width:auto; padding:6px 10px; background:var(--glass); color:#fff; border:1px solid var(--border); font-size:9px" onclick="game.buyRack()">+ СТОЙКА ($5k)</button>
            </div>
            <div class="farm-grid" id="farm"></div>
        </main>

        <aside class="sidebar">
            <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:10px;">
                <h2 style="margin:0; color:var(--neon); font-size:16px;">GPU MARKET</h2>
                <div style="font-size: 10px; color:#888; text-align:right">
                    LVL <span id="lvl">1</span> (<span id="xp-pct">0</span>%)
                    <div style="width:60px; height:3px; background:#222; margin-top:3px;"><div id="xp-bar-fill" style="height:100%; width:0%; background:var(--neon);"></div></div>
                </div>
            </div>
            <div id="shop"></div>
            <button onclick="game.reset()" style="background:none; border:none; color:#333; padding:15px; font-size: 9px; width: 100%;">СБРОСИТЬ ДАННЫЕ</button>
        </aside>
    </div>

    <script>
        const GPUS = [
            { name: "GT 1030", price: 150, hash: 5, lvl: 1, wear: 0.02, icon: "fa-microchip" },
            { name: "GTX 1050 Ti", price: 450, hash: 18, lvl: 1, wear: 0.015, icon: "fa-microchip" },
            { name: "RX 580", price: 900, hash: 40, lvl: 1, wear: 0.012, icon: "fa-microchip" },
            { name: "RTX 3060", price: 2500, hash: 110, lvl: 3, wear: 0.01, icon: "fa-memory" },
            { name: "RTX 4080", price: 8000, hash: 400, lvl: 6, wear: 0.008, icon: "fa-bolt" },
            { name: "RTX 4090", price: 15000, hash: 850, lvl: 10, wear: 0.006, icon: "fa-fire" },
            { name: "A100 Tensor", price: 50000, hash: 3000, lvl: 15, wear: 0.004, icon: "fa-brain" },
            { name: "H100 Hopper", price: 200000, hash: 12000, lvl: 25, wear: 0.002, icon: "fa-server" }
        ];

        const game = {
            cash: 1000, btc: 0, hashrate: 0, lvl: 1, xp: 0, nextLvl: 100,
            racks: [{gpus: []}], btcPrice: 65000, boost: 1,

            init() {
                this.load();
                this.showLoading(() => {
                    this.renderShop();
                    this.renderFarm();
                    this.updateUI();
                    this.startLoops();
                });
            },

            showLoading(callback) {
                let p = 0;
                const fill = document.getElementById('load-fill');
                const interval = setInterval(() => {
                    p += 10;
                    fill.style.width = p + '%';
                    if(p >= 100) {
                        clearInterval(interval);
                        document.getElementById('loading-screen').style.opacity = '0';
                        setTimeout(() => {
                            document.getElementById('loading-screen').style.display = 'none';
                            callback();
                        }, 400);
                    }
                }, 50);
            },

            buyGPU(id) {
                const g = GPUS[id];
                if (this.lvl < g.lvl || this.cash < g.price) return;
                const rack = this.racks.find(r => r.gpus.length < 8);
                if (!rack) return alert("Нужна новая стойка!");

                this.cash -= g.price;
                rack.gpus.push({ ...g, hp: 100 });
                this.recalcHash();
                this.addXP(g.price / 10);
                this.renderFarm();
                this.updateUI();
                this.save();
            },

            repairGPU(ri, gi) {
                const gpu = this.racks[ri].gpus[gi];
                const cost = Math.floor(gpu.price * 0.3);
                if(this.cash >= cost) {
                    this.cash -= cost;
                    gpu.hp = 100;
                    this.recalcHash();
                    this.renderFarm();
                    this.updateUI();
                }
            },

            recalcHash() {
                this.hashrate = 0;
                this.racks.forEach(r => r.gpus.forEach(g => { if(g.hp > 0) this.hashrate += g.hash; }));
            },

            startLoops() {
                setInterval(() => {
                    let changed = false;
                    this.racks.forEach(r => r.gpus.forEach(g => {
                        if(g.hp > 0) {
                            // ИЗНОС В 2 РАЗА БЫСТРЕЕ (wear * 2)
                            g.hp -= (g.wear * 2 * this.boost); 
                            if(g.hp <= 0) { g.hp = 0; changed = true; }
                        }
                    }));
                    if(changed) this.recalcHash();
                    
                    this.btc += (this.hashrate * this.boost) / 4000000;
                    this.btcPrice += (Math.random() - 0.5) * 400;
                    
                    this.updateUI();
                    this.updateHPUI();
                }, 1000);
                setInterval(() => this.save(), 5000);
            },

            updateHPUI() {
                this.racks.forEach((r, ri) => r.gpus.forEach((g, gi) => {
                    const bar = document.getElementById(`hp-${ri}-${gi}`);
                    if(bar) {
                        bar.style.width = g.hp + '%';
                        bar.style.background = g.hp < 30 ? 'var(--danger)' : 'var(--success)';
                        if(g.hp <= 0) {
                            const slot = bar.parentElement;
                            slot.className = 'slot broken';
                            slot.onclick = () => this.repairGPU(ri, gi);
                            slot.innerHTML = `🛠 РЕМОНТ ($${Math.floor(g.price*0.3)})`;
                        }
                    }
                }));
            },

            renderFarm() {
                const f = document.getElementById('farm');
                f.innerHTML = this.racks.map((r, ri) => `
                    <div class="rack">
                        <div style="font-size:8px; color:#444; margin-bottom:4px">NODE_0${ri+1}</div>
                        ${Array(8).fill(0).map((_, gi) => {
                            const g = r.gpus[gi];
                            if(!g) return `<div class="slot">ПУСТО</div>`;
                            const isBroken = g.hp <= 0;
                            return `
                                <div class="slot ${isBroken ? 'broken' : 'active'}" onclick="${isBroken ? `game.repairGPU(${ri},${gi})` : ''}">
                                    <div style="display:flex; justify-content:space-between; width:100%">
                                        <span>${isBroken ? '🛠 РЕМОНТ' : g.name}</span>
                                        <span style="font-size:8px">${Math.ceil(g.hp)}%</span>
                                    </div>
                                    ${!isBroken ? `<div class="hp-bar" id="hp-${ri}-${gi}" style="width:${g.hp}%"></div>` : ''}
                                </div>`;
                        }).join('')}
                    </div>
                `).join('');
                document.getElementById('node-count').innerText = this.racks.length;
            },

            renderShop() {
                document.getElementById('shop').innerHTML = GPUS.map((g, i) => `
                    <div class="shop-item ${this.lvl < g.lvl ? 'locked' : ''}" onclick="game.buyGPU(${i})">
                        <i class="fas ${g.icon}" style="color:var(--neon); font-size:18px"></i>
                        <div style="flex:1">
                            <b style="font-size:12px">${g.name}</b><br>
                            <small style="color:#666; font-size:9px">${g.hash} MH/s</small>
                        </div>
                        <div style="color:var(--success); font-weight:bold">$${g.price >= 1000 ? (g.price/1000).toFixed(1)+'k' : g.price}</div>
                    </div>
                `).join('');
            },

            updateUI() {
                document.getElementById('cash').innerText = `$${Math.floor(this.cash).toLocaleString()}`;
                document.getElementById('btc').innerText = `₿ ${this.btc.toFixed(5)}`;
                document.getElementById('hash').innerText = `${Math.floor(this.hashrate)} MH/s`;
                document.getElementById('lvl').innerText = this.lvl;
                document.getElementById('btc-p').innerText = Math.floor(this.btcPrice).toLocaleString();
                const xpPct = (this.xp/this.nextLvl*100).toFixed(0);
                document.getElementById('xp-bar-fill').style.width = xpPct + "%";
                document.getElementById('xp-pct').innerText = xpPct;
            },

            buyRack() { if(this.cash >= 5000) { this.cash -= 5000; this.racks.push({gpus:[]}); this.renderFarm(); this.updateUI(); }},
            sellBtc() { if(this.btc > 0) { this.cash += this.btc * this.btcPrice; this.btc = 0; this.updateUI(); }},
            
            manualMine(e) {
                if (navigator.vibrate) navigator.vibrate(15);
                const power = (10 + (this.hashrate * 0.02)) * this.boost;
                this.cash += power; this.addXP(power/10); this.updateUI();
                
                const x = e.clientX || window.innerWidth/2;
                const y = e.clientY || window.innerHeight/2;
                const el = document.createElement('div');
                el.className = 'floating-text'; el.innerText = `+$${Math.floor(power)}`;
                el.style.left = x + 'px'; el.style.top = y + 'px';
                document.body.appendChild(el); setTimeout(() => el.remove(), 600);
            },

            addXP(v) {
                this.xp += v;
                while(this.xp >= this.nextLvl) {
                    this.xp -= this.nextLvl; this.lvl++; this.nextLvl *= 1.5;
                    this.renderShop();
                }
            },

            activateBoost() {
                if(this.boost > 1) return;
                this.boost = 2;
                const b = document.getElementById('boost-btn');
                b.style.background = 'var(--danger)'; b.innerText = "X2 ACTIVE";
                setTimeout(() => { this.boost = 1; b.style.background = 'var(--gold)'; b.innerText = "BOOST"; }, 15000);
            },

            save() {
                const data = { cash: this.cash, btc: this.btc, lvl: this.lvl, xp: this.xp, nextLvl: this.nextLvl, racks: this.racks };
                localStorage.setItem('CryptoEmpire_Mobile_Save', JSON.stringify(data));
            },

            load() {
                const s = localStorage.getItem('CryptoEmpire_Mobile_Save');
                if(s) {
                    const d = JSON.parse(s);
                    Object.assign(this, d);
                    this.recalcHash();
                }
            },

            reset() { if(confirm("Удалить всё?")) { localStorage.clear(); location.reload(); } }
        };

        game.init();
    </script>
</body>
</html>
