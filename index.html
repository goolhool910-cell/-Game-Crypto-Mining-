<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CryptoEmpire: Mobile Edition</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --neon: #00f2ff; --accent: #bc13fe; --bg: #030303;
            --glass: rgba(255, 255, 255, 0.05); --border: rgba(255, 255, 255, 0.1);
            --success: #00ff88; --gold: #ffcc00; --danger: #ff3131;
        }

        * { box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body {
            background: var(--bg); color: #fff; margin: 0;
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }

        /* Адаптивная сетка основного контейнера */
        .app-container {
            display: grid;
            grid-template-columns: 350px 1fr 300px;
            height: 100vh;
            overflow: hidden;
        }

        /* Стили секций */
        .sidebar, .dashboard { 
            background: #080808; 
            border: 1px solid var(--border); 
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            overflow-y: auto;
        }

        .main { 
            padding: 15px; 
            overflow-y: auto; 
            background: radial-gradient(circle at center, #111, #000); 
            position: relative; 
            flex: 1;
        }

        /* Карточки в магазине */
        .shop-container { display: flex; flex-direction: column; gap: 8px; }
        .shop-item {
            background: var(--glass); border: 1px solid var(--border); border-radius: 12px;
            padding: 12px; cursor: pointer; transition: 0.2s;
            display: flex; align-items: center; gap: 12px;
        }
        .shop-item:active { transform: scale(0.98); background: rgba(0, 242, 255, 0.1); }
        .shop-item.locked { opacity: 0.3; filter: grayscale(1); }
        .shop-item i { font-size: 20px; color: var(--neon); width: 25px; }

        /* Стойки */
        .farm-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
        .rack { background: #111; border: 1px solid #222; border-radius: 10px; padding: 10px; }
        .slot { height: 28px; background: rgba(0,0,0,0.5); margin-bottom: 4px; border-radius: 4px; display: flex; align-items: center; padding: 0 8px; font-size: 10px; border: 1px solid transparent; }
        .slot.active { border-color: var(--accent); color: var(--neon); }

        /* Статистика */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .stat-card { background: #121212; padding: 12px; border-radius: 10px; border-left: 3px solid var(--accent); }
        .stat-card small { color: #555; text-transform: uppercase; font-size: 9px; display: block; }
        .stat-card div { font-size: 16px; font-weight: bold; }

        /* Кнопки */
        .btn { width: 100%; padding: 14px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 12px; }
        .btn-mine { background: linear-gradient(45deg, var(--neon), var(--accent)); color: #000; height: 60px; font-size: 16px; margin-top: 10px; }
        .btn-boost { background: var(--gold); color: #000; }
        .btn-boost.active { background: var(--danger); animation: pulse 1s infinite; }

        /* Мобильная адаптация через Media Queries */
        @media (max-width: 1024px) {
            body { overflow-y: auto; height: auto; }
            .app-container {
                display: flex;
                flex-direction: column;
                height: auto;
            }
            .sidebar, .dashboard, .main { 
                overflow-y: visible; 
                height: auto; 
                border: none;
                border-bottom: 1px solid var(--border);
            }
            /* Порядок блоков на мобилке: Статистика -> Ферма -> Магазин */
            .dashboard { order: 1; position: sticky; top: 0; z-index: 100; border-bottom: 2px solid var(--neon); }
            .main { order: 2; min-height: 400px; }
            .sidebar { order: 3; }
            
            .farm-grid { grid-template-columns: 1fr 1fr; } /* По 2 стойки в ряд */
        }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
        .floating-text { position: absolute; color: var(--neon); font-weight: bold; pointer-events: none; animation: float 0.7s forwards; z-index: 1000; text-shadow: 0 0 10px var(--neon); }
        @keyframes float { to { transform: translateY(-80px); opacity: 0; } }
    </style>
</head>
<body>

    <div class="app-container">
        <aside class="dashboard">
            <div class="stats-grid">
                <div class="stat-card"><small>Баланс</small><div id="cash" style="color:var(--success)">$ 0</div></div>
                <div class="stat-card"><small>Хешрейт</small><div id="hash">0 MH/s</div></div>
                <div class="stat-card"><small>Крипто</small><div id="btc" style="color:var(--neon)">₿ 0.00</div></div>
                <div class="stat-card"><small>Курс BTC</small><div>$<span id="btc-p">65000</span></div></div>
            </div>
            
            <div style="display: flex; gap: 5px;">
                <button class="btn" style="background:var(--success); flex: 1" onclick="game.sellBtc()">Продать</button>
                <button class="btn btn-boost" id="boost-btn" style="flex: 1" onclick="game.activateBoost()">BOOST</button>
            </div>
            <button class="btn btn-mine" onclick="game.manualMine(event)">ГЕНЕРИРОВАТЬ ХЕШ</button>
        </aside>

        <main class="main" id="main-area">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <h2 style="margin:0; font-size:18px;">NODES [<span id="node-count">0</span>]</h2>
                <button class="btn" style="width:auto; padding:8px 12px; background:var(--glass); color:#fff; border:1px solid var(--border); font-size:10px" onclick="game.buyRack()">+ СТОЙКА ($5k)</button>
            </div>
            <div class="farm-grid" id="farm"></div>
        </main>

        <aside class="sidebar">
            <h2 style="margin:0; color:var(--neon); font-size:18px;">GPU MARKET</h2>
            <div style="font-size: 11px; color:#888">LEVEL <span id="lvl">1</span> (<span id="xp-pct">0</span>%)</div>
            <div style="height:4px; background:#222; border-radius:2px;">
                <div id="xp-bar-fill" style="height:100%; width:0%; background:var(--neon); transition: 0.3s;"></div>
            </div>
            <div class="shop-container" id="shop"></div>
            <button onclick="game.reset()" style="background:none; border:none; color:#333; padding:20px">Сброс прогресса</button>
        </aside>
    </div>

    <script>
        const GPUS = [
            { name: "GT 1030", price: 150, hash: 5, lvl: 1, icon: "fa-microchip" },
            { name: "GTX 1050 Ti", price: 450, hash: 18, lvl: 1, icon: "fa-microchip" },
            { name: "RX 580", price: 900, hash: 40, lvl: 1, icon: "fa-microchip" },
            { name: "RTX 3060", price: 2500, hash: 110, lvl: 3, icon: "fa-memory" },
            { name: "RTX 4080", price: 8000, hash: 400, lvl: 6, icon: "fa-bolt" },
            { name: "RTX 4090", price: 15000, hash: 850, lvl: 10, icon: "fa-fire" },
            { name: "A100 Tensor", price: 50000, hash: 3000, lvl: 15, icon: "fa-brain" },
            { name: "H100 Hopper", price: 200000, hash: 12000, lvl: 25, icon: "fa-server" },
            { name: "Quantum Chip", price: 1000000, hash: 75000, lvl: 50, icon: "fa-atom" },
            { name: "Dyson Link", price: 10000000, hash: 800000, lvl: 100, icon: "fa-sun" }
        ];

        const game = {
            cash: 6000, btc: 0, hashrate: 0, 
            lvl: 1, xp: 0, nextLvl: 100,
            racks: [], btcPrice: 65000, boost: 1,

            init() {
                this.load();
                this.renderShop();
                this.renderFarm();
                this.updateUI();
                this.startLoops();
            },

            save() {
                const data = { cash: this.cash, btc: this.btc, lvl: this.lvl, xp: this.xp, nextLvl: this.nextLvl, racks: this.racks };
                localStorage.setItem('CryptoEmpire_Mobile_v1', JSON.stringify(data));
            },

            load() {
                const s = localStorage.getItem('CryptoEmpire_Mobile_v1');
                if(s) {
                    const d = JSON.parse(s);
                    Object.assign(this, d);
                    this.recalcHash();
                }
            },

            reset() { if(confirm("Удалить всё?")) { localStorage.clear(); location.reload(); } },

            renderShop() {
                const shop = document.getElementById('shop');
                shop.innerHTML = GPUS.map((g, i) => `
                    <div class="shop-item ${this.lvl < g.lvl ? 'locked' : ''}" onclick="game.buyGPU(${i})">
                        <i class="fas ${g.icon}"></i>
                        <div style="flex:1">
                            <b style="font-size:13px">${g.name}</b><br>
                            <span style="font-size:10px; color:#888">${g.hash} MH/s</span>
                        </div>
                        <div style="color:var(--success); font-size:12px">$${g.price >= 1000 ? (g.price/1000).toFixed(1)+'k' : g.price}</div>
                    </div>
                `).join('');
            },

            buyRack() {
                if (this.cash >= 5000) {
                    this.cash -= 5000;
                    this.racks.push({ gpus: [] });
                    this.renderFarm();
                    this.updateUI();
                    this.save();
                }
            },

            buyGPU(id) {
                const g = GPUS[id];
                if (this.lvl < g.lvl || this.cash < g.price) return;
                const rack = this.racks.find(r => r.gpus.length < 8);
                if (!rack) return alert("Нужна новая стойка!");

                this.cash -= g.price;
                rack.gpus.push(g);
                this.recalcHash();
                this.addXP(g.price / 10);
                this.renderFarm();
                this.updateUI();
                this.save();
            },

            recalcHash() {
                this.hashrate = 0;
                this.racks.forEach(r => r.gpus.forEach(g => this.hashrate += g.hash));
            },

            addXP(v) {
                this.xp += v;
                while (this.xp >= this.nextLvl) {
                    this.xp -= this.nextLvl;
                    this.lvl++;
                    this.nextLvl *= 1.6;
                    this.renderShop();
                }
            },

            activateBoost() {
                if (this.boost > 1) return;
                this.boost = 2;
                const btn = document.getElementById('boost-btn');
                btn.classList.add('active');
                setTimeout(() => {
                    this.boost = 1;
                    btn.classList.remove('active');
                }, 20000);
            },

            manualMine(e) {
                const power = (15 + (this.hashrate * 0.1)) * this.boost;
                this.cash += power;
                this.addXP(power / 4);
                
                // Центрируем текст для мобилок
                const x = e.clientX || window.innerWidth / 2;
                const y = e.clientY || window.innerHeight / 2;
                this.createFT(x, y, `+$${Math.floor(power)}`);
                this.updateUI();
            },

            sellBtc() {
                if(this.btc <= 0) return;
                this.cash += this.btc * this.btcPrice;
                this.btc = 0;
                this.updateUI();
                this.save();
            },

            createFT(x, y, t) {
                const el = document.createElement('div');
                el.className = 'floating-text'; el.innerText = t;
                el.style.left = (x - 20) + 'px'; el.style.top = (y - 20) + 'px';
                document.body.appendChild(el);
                setTimeout(() => el.remove(), 700);
            },

            renderFarm() {
                const f = document.getElementById('farm');
                f.innerHTML = this.racks.map((r, i) => `
                    <div class="rack">
                        <div style="font-size:9px; color:#444; margin-bottom:5px">NODE_0${i+1}</div>
                        ${Array(8).fill(0).map((_, idx) => {
                            const gpu = r.gpus[idx];
                            return `<div class="slot ${gpu ? 'active' : ''}">
                                ${gpu ? gpu.name : 'EMPTY'}
                            </div>`;
                        }).join('')}
                    </div>
                `).join('');
                document.getElementById('node-count').innerText = this.racks.length;
            },

            updateUI() {
                document.getElementById('cash').innerText = `$${Math.floor(this.cash).toLocaleString()}`;
                document.getElementById('btc').innerText = `₿ ${this.btc.toFixed(4)}`;
                document.getElementById('hash').innerText = `${this.hashrate.toLocaleString()} MH/s`;
                document.getElementById('lvl').innerText = this.lvl;
                document.getElementById('xp-pct').innerText = Math.floor((this.xp/this.nextLvl)*100);
                document.getElementById('xp-bar-fill').style.width = (this.xp/this.nextLvl*100) + "%";
                document.getElementById('btc-p').innerText = Math.floor(this.btcPrice).toLocaleString();
            },

            startLoops() {
                setInterval(() => {
                    this.btc += (this.hashrate * this.boost) / 3000000;
                    this.btcPrice += (Math.random() - 0.5) * 600;
                    if(this.btcPrice < 20000) this.btcPrice = 20000;
                    this.updateUI();
                }, 1000);
                setInterval(() => this.save(), 10000);
            }
        };

        game.init();
    </script>
</body>
</html>
