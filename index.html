<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CryptoEmpire Mobile Fixed</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --neon: #00f2ff; --accent: #bc13fe; --bg: #030303;
            --glass: rgba(255, 255, 255, 0.07); --border: rgba(255, 255, 255, 0.1);
            --success: #00ff88; --gold: #ffcc00; --danger: #ff3131; --warning: #ffaa00;
        }

        * { 
            box-sizing: border-box; 
            font-family: 'Inter', -apple-system, sans-serif; 
            -webkit-tap-highlight-color: transparent; 
            user-select: none;
            touch-action: manipulation; /* Фикс зума при тапах */
        }
        
        body {
            background: var(--bg); color: #fff; margin: 0;
            display: flex; flex-direction: column; 
            height: 100vh; height: 100dvh; /* Фикс высоты на мобилках */
            overflow: hidden;
        }

        #loading-screen {
            position: fixed; top:0; left:0; width:100%; height:100%; 
            background: #000; z-index: 9999; display: flex; 
            flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.4s;
        }
        .loader-bar { width: 150px; height: 2px; background: #222; margin-top: 15px; }
        .loader-fill { width: 0%; height: 100%; background: var(--neon); transition: 0.2s; }

        .app-container { display: flex; flex-direction: column; height: 100%; }

        /* Шапка */
        .dashboard { 
            background: #0a0a0a; border-bottom: 1px solid var(--border); 
            padding: 10px 15px; flex-shrink: 0;
        }

        /* Ферма */
        .main { 
            flex: 1; overflow-y: auto; padding: 10px;
            background: radial-gradient(circle at top, #0f0f0f, #000);
            -webkit-overflow-scrolling: touch;
        }

        /* Магазин */
        .sidebar { 
            background: #0a0a0a; border-top: 1px solid var(--border);
            padding: 10px 15px; height: 32vh; overflow-y: auto; flex-shrink: 0;
        }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        .stat-card { background: #121212; padding: 8px; border-radius: 10px; border-left: 3px solid var(--accent); }
        .stat-card small { color: #555; text-transform: uppercase; font-size: 8px; display: block; margin-bottom: 2px; }
        .stat-val { font-size: 13px; font-weight: bold; font-variant-numeric: tabular-nums; }

        .farm-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .rack { background: rgba(255,255,255,0.02); border: 1px solid #222; border-radius: 12px; padding: 8px; }
        
        .slot { 
            height: 42px; background: rgba(0,0,0,0.5); margin-bottom: 5px; 
            border-radius: 8px; display: flex; flex-direction: column; 
            justify-content: center; padding: 0 10px; font-size: 10px; 
            position: relative; overflow: hidden; border: 1px solid #1a1a1a;
        }
        .slot.broken { border-color: var(--danger); color: var(--danger); }
        .hp-bar { position: absolute; bottom: 0; left: 0; height: 2px; transition: width 0.3s; }

        .btn { 
            width: 100%; padding: 12px; border-radius: 12px; border: none; 
            font-weight: 800; cursor: pointer; text-transform: uppercase; font-size: 12px;
        }
        .btn-mine { 
            background: linear-gradient(45deg, var(--neon), var(--accent)); 
            color: #000; height: 54px; font-size: 15px; margin-top: 8px;
            box-shadow: 0 4px 15px rgba(0, 242, 255, 0.15);
        }
        .btn:active { transform: scale(0.96); }

        .shop-item {
            background: var(--glass); border: 1px solid var(--border); border-radius: 12px;
            padding: 12px; display: flex; align-items: center; gap: 12px; margin-bottom: 8px;
        }
        .shop-item.locked { opacity: 0.25; filter: grayscale(1); pointer-events: none; }

        .floating-text { 
            position: absolute; color: var(--neon); font-weight: 900; 
            pointer-events: none; animation: float 0.6s ease-out forwards; 
            z-index: 1000; text-shadow: 0 0 10px rgba(0,242,255,0.5);
        }
        @keyframes float { 
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-70px) scale(1.2); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="loading-screen">
        <i class="fas fa-microchip fa-2x" style="color: var(--neon)"></i>
        <div class="loader-bar"><div class="loader-fill" id="load-fill"></div></div>
    </div>

    <div class="app-container">
        <header class="dashboard">
            <div class="stats-grid">
                <div class="stat-card"><small>Баланс</small><div id="cash" class="stat-val" style="color:var(--success)">$ 0</div></div>
                <div class="stat-card"><small>Хешрейт</small><div id="hash" class="stat-val">0 MH/s</div></div>
                <div class="stat-card"><small>BTC</small><div id="btc" class="stat-val" style="color:var(--neon)">₿ 0.00000</div></div>
                <div class="stat-card"><small>Курс</small><div class="stat-val">$<span id="btc-p">0</span></div></div>
            </div>
            <div style="display: flex; gap: 8px;">
                <button class="btn" style="background:var(--success); flex: 1" onclick="game.sellBtc()">Продать</button>
                <button class="btn" id="boost-btn" style="background:var(--gold); color:#000; flex: 1" onclick="game.activateBoost()">BOOST</button>
            </div>
            <button class="btn btn-mine" onclick="game.manualMine(event)">TAP TO MINE</button>
        </header>

        <main class="main">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                <h2 style="margin:0; font-size:14px; letter-spacing: 1px;">NODES [<span id="node-count">0</span>]</h2>
                <button class="btn" style="width:auto; padding:6px 12px; background:var(--glass); color:#fff; border:1px solid var(--border); font-size:10px" onclick="game.buyRack()">+ СТОЙКА ($5k)</button>
            </div>
            <div class="farm-grid" id="farm"></div>
        </main>

        <aside class="sidebar">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                <h2 style="margin:0; color:var(--neon); font-size:15px;">GPU MARKET</h2>
                <div style="font-size: 10px; color:#888;">LVL <span id="lvl">1</span></div>
            </div>
            <div id="shop"></div>
            <button onclick="game.reset()" style="background:none; border:none; color:#333; padding:20px; font-size: 10px; width: 100%;">СБРОС ПРОГРЕССА</button>
        </aside>
    </div>

    <script>
        const GPUS = [
            { name: "GT 1030", price: 150, hash: 5, lvl: 1, wear: 0.02, icon: "fa-microchip" },
            { name: "GTX 1050 Ti", price: 450, hash: 18, lvl: 1, wear: 0.015, icon: "fa-microchip" },
            { name: "RX 580", price: 900, hash: 40, lvl: 1, wear: 0.012, icon: "fa-microchip" },
            { name: "RTX 3060", price: 2500, hash: 110, lvl: 3, wear: 0.01, icon: "fa-memory" },
            { name: "RTX 4080", price: 8000, hash: 400, lvl: 6, wear: 0.008, icon: "fa-bolt" },
            { name: "RTX 4090", price: 15000, hash: 850, lvl: 10, wear: 0.006, icon: "fa-fire" },
            { name: "H100 Hopper", price: 180000, hash: 12000, lvl: 20, wear: 0.003, icon: "fa-server" }
        ];

        const game = {
            cash: 1000, btc: 0, hashrate: 0, lvl: 1, xp: 0, nextLvl: 100,
            racks: [{gpus: []}], btcPrice: 65000, boost: 1,

            init() {
                this.load();
                this.showLoading(() => {
                    this.renderShop();
                    this.renderFarm();
                    this.updateUI();
                    this.startLoops();
                });
                window.addEventListener('beforeunload', () => this.save());
            },

            showLoading(callback) {
                let p = 0;
                const fill = document.getElementById('load-fill');
                const interval = setInterval(() => {
                    p += 20;
                    fill.style.width = p + '%';
                    if(p >= 100) {
                        clearInterval(interval);
                        const screen = document.getElementById('loading-screen');
                        screen.style.opacity = '0';
                        setTimeout(() => { screen.style.display = 'none'; callback(); }, 400);
                    }
                }, 60);
            },

            buyGPU(id) {
                const g = GPUS[id];
                if (this.lvl < g.lvl || this.cash < g.price) return;
                const rack = this.racks.find(r => r.gpus.length < 8);
                if (!rack) return alert("Все стойки заняты!");

                this.cash -= g.price;
                rack.gpus.push({ ...g, hp: 100 });
                this.recalcHash();
                this.addXP(g.price / 8);
                this.renderFarm();
                this.updateUI();
                this.save();
            },

            repairGPU(ri, gi) {
                const gpu = this.racks[ri].gpus[gi];
                const cost = Math.floor(gpu.price * 0.3);
                if(this.cash >= cost) {
                    this.cash -= cost;
                    gpu.hp = 100;
                    this.recalcHash();
                    this.renderFarm();
                    this.updateUI();
                }
            },

            recalcHash() {
                this.hashrate = 0;
                this.racks.forEach(r => r.gpus.forEach(g => { if(g.hp > 0) this.hashrate += g.hash; }));
            },

            startLoops() {
                // Основной цикл: добыча и износ
                setInterval(() => {
                    let changed = false;
                    this.racks.forEach(r => r.gpus.forEach(g => {
                        if(g.hp > 0) {
                            // ИЗНОС В 2 РАЗА БЫСТРЕЕ (wear * 2)
                            g.hp -= (g.wear * 2 * this.boost); 
                            if(g.hp <= 0) { g.hp = 0; changed = true; }
                        }
                    }));
                    if(changed) this.recalcHash();
                    
                    this.btc += (this.hashrate * this.boost) / 5000000;
                    this.btcPrice += (Math.random() - 0.5) * 300;
                    if(this.btcPrice < 15000) this.btcPrice = 15000;
                    
                    this.updateUI();
                    this.updateHPUI();
                }, 1000);
            },

            updateHPUI() {
                this.racks.forEach((r, ri) => r.gpus.forEach((g, gi) => {
                    const bar = document.getElementById(`hp-${ri}-${gi}`);
                    const hpText = document.getElementById(`hpt-${ri}-${gi}`);
                    if(bar) {
                        bar.style.width = g.hp + '%';
                        bar.style.background = g.hp < 30 ? 'var(--danger)' : (g.hp < 60 ? 'var(--warning)' : 'var(--success)');
                        if(hpText) hpText.innerText = Math.ceil(g.hp) + '%';
                        
                        if(g.hp <= 0) {
                            const slot = bar.parentElement;
                            if(!slot.classList.contains('broken')) {
                                slot.className = 'slot broken';
                                slot.onclick = () => this.repairGPU(ri, gi);
                                slot.innerHTML = `<span>🛠 РЕМОНТ ($${Math.floor(g.price*0.3)})</span>`;
                            }
                        }
                    }
                }));
            },

            renderFarm() {
                const f = document.getElementById('farm');
                f.innerHTML = this.racks.map((r, ri) => `
                    <div class="rack">
                        <div style="font-size:7px; color:#555; margin-bottom:5px">#NODE_${ri+1}</div>
                        ${Array(8).fill(0).map((_, gi) => {
                            const g = r.gpus[gi];
                            if(!g) return `<div class="slot" style="color:#222">EMPTY</div>`;
                            const isBroken = g.hp <= 0;
                            return `
                                <div class="slot ${isBroken ? 'broken' : ''}" ${isBroken ? `onclick="game.repairGPU(${ri},${gi})"` : ''}>
                                    <div style="display:flex; justify-content:space-between; z-index:1">
                                        <span>${isBroken ? '🛠 REPAIR' : g.name}</span>
                                        <span id="hpt-${ri}-${gi}">${Math.ceil(g.hp)}%</span>
                                    </div>
                                    ${!isBroken ? `<div class="hp-bar" id="hp-${ri}-${gi}" style="width:${g.hp}%"></div>` : ''}
                                </div>`;
                        }).join('')}
                    </div>
                `).join('');
                document.getElementById('node-count').innerText = this.racks.length;
            },

            renderShop() {
                document.getElementById('shop').innerHTML = GPUS.map((g, i) => `
                    <div class="shop-item ${this.lvl < g.lvl ? 'locked' : ''}" onclick="game.buyGPU(${i})">
                        <i class="fas ${g.icon}" style="color:var(--neon); font-size:16px"></i>
                        <div style="flex:1">
                            <b style="font-size:12px">${g.name}</b><br>
                            <small style="color:#666; font-size:9px">${g.hash} MH/s | Lvl ${g.lvl}</small>
                        </div>
                        <div style="color:var(--success); font-weight:bold; font-size:12px">$${g.price >= 1000 ? (g.price/1000).toFixed(g.price >= 10000 ? 0 : 1)+'k' : g.price}</div>
                    </div>
                `).join('');
            },

            updateUI() {
                document.getElementById('cash').innerText = `$${Math.floor(this.cash).toLocaleString()}`;
                document.getElementById('btc').innerText = `₿ ${this.btc.toFixed(5)}`;
                document.getElementById('hash').innerText = `${Math.floor(this.hashrate).toLocaleString()} MH/s`;
                document.getElementById('lvl').innerText = this.lvl;
                document.getElementById('btc-p').innerText = Math.floor(this.btcPrice).toLocaleString();
            },

            buyRack() {
                if(this.cash >= 5000) {
                    this.cash -= 5000;
                    this.racks.push({gpus:[]});
                    this.renderFarm();
                    this.updateUI();
                }
            },

            sellBtc() {
                if(this.btc > 0) {
                    this.cash += this.btc * this.btcPrice;
                    this.btc = 0;
                    this.updateUI();
                    this.save();
                }
            },
            
            manualMine(e) {
                if (navigator.vibrate) navigator.vibrate(10);
                const power = (10 + (this.hashrate * 0.03)) * this.boost;
                this.cash += power;
                this.addXP(power/5);
                this.updateUI();
                
                const x = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
                const y = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
                
                const el = document.createElement('div');
                el.className = 'floating-text'; el.innerText = `+$${Math.floor(power)}`;
                el.style.left = (x || window.innerWidth/2) + 'px'; 
                el.style.top = (y || window.innerHeight/2) + 'px';
                document.body.appendChild(el); 
                setTimeout(() => el.remove(), 600);
            },

            addXP(v) {
                this.xp += v;
                if(this.xp >= this.nextLvl) {
                    this.xp = 0; this.lvl++; this.nextLvl *= 1.6;
                    this.renderShop();
                }
            },

            activateBoost() {
                if(this.boost > 1) return;
                this.boost = 2;
                const b = document.getElementById('boost-btn');
                b.style.background = 'var(--danger)'; b.innerText = "X2 ACTIVE";
                setTimeout(() => { 
                    this.boost = 1; 
                    b.style.background = 'var(--gold)'; 
                    b.innerText = "BOOST"; 
                }, 20000);
            },

            save() {
                const data = { cash: this.cash, btc: this.btc, lvl: this.lvl, xp: this.xp, nextLvl: this.nextLvl, racks: this.racks };
                localStorage.setItem('CryptoEmpire_Mobile_V3', JSON.stringify(data));
            },

            load() {
                const s = localStorage.getItem('CryptoEmpire_Mobile_V3');
                if(s) {
                    const d = JSON.parse(s);
                    Object.assign(this, d);
                    this.recalcHash();
                }
            },

            reset() { if(confirm("Сбросить весь прогресс?")) { localStorage.clear(); location.reload(); } }
        };

        game.init();
    </script>
</body>
</html>
